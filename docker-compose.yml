# Local: chạy thẳng `docker compose up -d` (dùng giá trị mặc định, cổng 5434).
# Server: đọc biến từ .env ở thư mục gốc (POSTGRES_PASSWORD bắt buộc đổi).
services:
  postgres:
    image: postgres:16-alpine
    container_name: dautu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dautu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dautu}
      POSTGRES_DB: ${POSTGRES_DB:-dautu}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432" # chỉ máy này truy cập được
    volumes:
      - dautu-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Tìm kiếm tin tức — chỉ dùng khi phát triển local: `docker compose --profile search up -d`.
  # Server dùng Amazon OpenSearch Service (OPENSEARCH_URL trong .env), không chạy container này.
  opensearch:
    image: opensearchproject/opensearch:2.19.2
    container_name: dautu-opensearch
    profiles: [search]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9201}:9200"
    volumes:
      - dautu-os:/usr/share/opensearch/data

volumes:
  dautu-pg:
    name: dautuchungkhoan_dautu-pg # tên cố định (giữ đúng volume local cũ), không phụ thuộc tên thư mục
  dautu-os:
    name: dautu-opensearch-data
