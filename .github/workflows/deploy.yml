# CI on every push/PR (GitHub-hosted). Deploy on push to main via the self-hosted runner on the server.
# The server is only reachable over Tailscale, so the runner installed on it pulls jobs from GitHub
# instead of GitHub connecting in. The deploy job never runs for pull requests, so code from forks
# can't execute on the server.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL thật cho test tích hợp (khoá, transaction, chống trùng) — unit test với Prisma giả không bắt được
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dautu
          POSTGRES_PASSWORD: dautu
          POSTGRES_DB: dautu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dautu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dautu:dautu@localhost:5432/dautu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run install:all
      - name: Typecheck & build
        run: npm run check
      - name: Backend unit tests
        run: npm test
      - name: Backend integration tests (PostgreSQL)
        working-directory: backend
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
          npm run test:int -- --ci
      - name: Lint (frontend + backend)
        run: npm run lint

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dautu]
    timeout-minutes: 20
    concurrency:
      group: deploy-dautu
      cancel-in-progress: false
    env:
      APP_DIR: /home/thangvv/apps/dautu
    steps:
      - uses: actions/checkout@v4

      - name: Sync code into the app directory (keeps .env, node_modules)
        run: |
          mkdir -p "$APP_DIR"
          rsync -a --delete \
            --exclude .git --exclude node_modules --exclude dist --exclude .env --exclude backend/data \
            ./ "$APP_DIR/"

      - name: Make sure Postgres is up
        working-directory: ${{ env.APP_DIR }}
        run: docker compose up -d --wait --remove-orphans

      - name: Install & build
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm run install:all
          npm run build

      - name: Migrate database
        working-directory: ${{ env.APP_DIR }}/backend
        run: node --env-file=../.env node_modules/.bin/prisma migrate deploy

      - name: Reload app (pm2)
        working-directory: ${{ env.APP_DIR }}
        run: |
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4200/api/health; then echo; echo "✅ deployed $GITHUB_SHA"; exit 0; fi
            sleep 2
          done
          echo "❌ app did not become healthy"; pm2 logs dautu --lines 80 --nostream; exit 1
