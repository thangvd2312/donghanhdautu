# CI cho mọi push/PR (GitHub-hosted). Push lên main → build image → ghcr.io/thangvd2312/donghanhdautu:main
# → k3s tự kéo về và triển khai (CronJob autodeploy). Không còn self-hosted runner trên ZBook.
# Code từ PR/fork không bao giờ được build image hay chạm vào cụm.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # main: xếp hàng, :main chỉ đổi khi lần trước verify xong

env:
  CONTEXTS: k3s/dautu k3s/dautu-worker

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL thật cho test tích hợp (khoá, transaction, chống trùng) — unit test với Prisma giả không bắt được
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dautu
          POSTGRES_PASSWORD: dautu
          POSTGRES_DB: dautu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dautu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dautu:dautu@localhost:5432/dautu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run install:all
      - name: Typecheck & build
        run: npm run check
      - name: Backend unit tests
        run: npm test
      - name: Frontend tests (hook, phản hồi về không theo thứ tự)
        run: npm test --prefix frontend
      - name: Backend integration tests (PostgreSQL)
        working-directory: backend
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
          npm run test:int -- --ci
      - name: Lint (frontend + backend)
        run: npm run lint

  image:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Dockerfile + .dockerignore ở gốc repo. Label revision = commit -> autodeploy trong k3s đọc để báo status về đúng commit.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # k3s chỉ vào được qua Tailscale nên GitHub không gọi vào. CronJob "autodeploy" trong cụm (2 phút/lần) tự kéo image mới
  # rồi gửi commit status "k3s/<deployment>". Job này chờ status đó: run xanh = app mới đã thật sự chạy trên k3s.
  verify:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Chờ k3s triển khai (${{ env.CONTEXTS }})
        run: |
          for i in $(seq 1 150); do
            done_all=1
            for c in $CONTEXTS; do
              st=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq ".statuses[] | select(.context==\"$c\") | .state + \"|\" + .description")
              case "${st%%|*}" in
                success) ;;
                failure|error) echo "❌ $c: ${st#*|}"; echo "Xem log: kubectl -n apps logs -l app=autodeploy --tail=100"; exit 1 ;;
                *) done_all=0 ;;
              esac
            done
            if [ $done_all = 1 ]; then echo "✅ $CONTEXTS đã chạy commit $GITHUB_SHA"; exit 0; fi
            sleep 10
          done
          echo "❌ Quá 25 phút chưa thấy k3s triển khai (CronJob autodeploy có chạy không?)"; exit 1
      - name: Worker có nhịp tim (qua https://dautu.thangvu.io.vn/api/health)
        run: |
          for i in $(seq 1 18); do
            out=$(curl -fsS -m 10 https://dautu.thangvu.io.vn/api/health || true)
            if echo "$out" | grep -q '"worker":{"ok":true'; then echo "✅ $out"; exit 0; fi
            sleep 10
          done
          echo "❌ worker chưa có nhịp tim: $out"; exit 1
