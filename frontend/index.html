<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Đầu Tư" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font không chặn lần vẽ đầu: tải song song, có rồi mới áp (display=swap) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      /* Màn khởi động: hiện ngay khi HTML về, React thay thế khi vẽ xong */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f6f9; }
      .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; background: #dbe3f5; overflow: hidden; position: relative; }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #1d4ed8; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-color-scheme: dark) {
        .boot { background: #0e1117; }
        .boot-bar { background: #1e293b; }
        .boot-bar::after { background: #60a5fa; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
    <title>Đồng Hành Đầu Tư</title>
    <!-- Thẻ xem trước khi chia sẻ link (Zalo, Messenger, Telegram, iMessage…). Server thay title/description/url theo từng trang. -->
    <meta name="description" content="Theo dõi danh mục, cổ tức, lịch sự kiện và kế hoạch đầu tư — bình tĩnh, có số liệu và dẫn nguồn." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Đồng Hành Đầu Tư" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://dautu.thangvu.io.vn/" />
    <meta property="og:title" content="Đồng Hành Đầu Tư" />
    <meta property="og:description" content="Theo dõi danh mục, cổ tức, lịch sự kiện và kế hoạch đầu tư — bình tĩnh, có số liệu và dẫn nguồn." />
    <meta property="og:image" content="https://dautu.thangvu.io.vn/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Đồng Hành Đầu Tư — đầu tư bình tĩnh, có số liệu và dẫn nguồn" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Đồng Hành Đầu Tư" />
    <meta name="twitter:description" content="Theo dõi danh mục, cổ tức, lịch sự kiện và kế hoạch đầu tư — bình tĩnh, có số liệu và dẫn nguồn." />
    <meta name="twitter:image" content="https://dautu.thangvu.io.vn/og-image.jpg" />
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Đang mở Đồng Hành Đầu Tư">
        <div class="boot-inner">
          <img src="/favicon.svg" width="56" height="56" alt="" />
          <div class="boot-bar"></div>
        </div>
      </div>
    </div>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
